<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="إرواء - فريق العمل">
    <title>إرواء - فريق العمل</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>💧</text></svg>">
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-teal: #3eb19f;
            --primary-blue: #2d5f7a;
            --secondary-green: #7dc88f;
            --light-teal: #a8d5cc;
            --bg-light: #f0f8f6;
            --text-dark: #1a3a4a;
            --white: #ffffff;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, var(--bg-light) 0%, #e8f5f2 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 0;
            overflow-x: hidden;
            direction: rtl;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px 20px;
        }
        
        /* Logo Section */
        .logo-section {
            text-align: center;
            margin-bottom: 25px;
            animation: fadeInDown 0.8s ease-out;
        }
        
        .logo-container {
            width: 140px;
            height: 140px;
            margin: 0 auto 15px;
            position: relative;
            animation: float 3s ease-in-out infinite;
        }
        
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 30px rgba(62, 177, 159, 0.3));
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        
        .main-title {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--primary-teal) 0%, var(--secondary-green) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .subtitle {
            color: var(--primary-blue);
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 6px;
        }
        
        .description {
            color: var(--text-dark);
            font-size: 0.95rem;
            line-height: 1.5;
            max-width: 700px;
            margin: 0 auto;
            opacity: 0.9;
        }
        
        /* Team Section */
        .team-section {
            background: linear-gradient(135deg, var(--white) 0%, #f9fdfc 100%);
            border-radius: 24px;
            padding: 30px 30px;
            box-shadow: 0 15px 50px rgba(62, 177, 159, 0.15);
            border: 3px solid var(--primary-teal);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.8s ease-out 0.3s both;
        }
        
        .team-section::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            left: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--primary-teal) 0%, var(--secondary-green) 50%, var(--primary-teal) 100%);
        }
        
        .section-title {
            text-align: center;
            color: var(--primary-blue);
            font-size: 1.6rem;
            font-weight: 900;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        
        .section-title i {
            color: var(--primary-teal);
            font-size: 1.6rem;
            font-style: normal;
        }
        
        /* Team Grid */
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }
        
        .team-member {
            background: linear-gradient(135deg, #f0f8f6 0%, #e8f5f2 100%);
            padding: 25px 20px;
            border-radius: 18px;
            text-align: center;
            transition: all 0.4s ease;
            border: 3px solid transparent;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            position: relative;
            overflow: hidden;
        }
        
        .team-member::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            left: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-teal) 0%, var(--secondary-green) 100%);
            transform: scaleX(0);
            transition: transform 0.4s ease;
        }
        
        .team-member:hover::before {
            transform: scaleX(1);
        }
        
        .team-member:hover {
            transform: translateY(-10px);
            border-color: var(--primary-teal);
            box-shadow: 0 15px 40px rgba(62, 177, 159, 0.25);
            background: var(--white);
        }
        
        .team-avatar {
            font-size: 3rem;
            margin-bottom: 12px;
            filter: drop-shadow(0 5px 15px rgba(62, 177, 159, 0.3));
        }
        
        .team-name {
            font-weight: 800;
            color: var(--primary-blue);
            margin-bottom: 12px;
            font-size: 1.1rem;
            line-height: 1.4;
        }
        
        .team-linkedin {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--white);
            background: linear-gradient(135deg, var(--primary-teal) 0%, var(--secondary-green) 100%);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 700;
            padding: 10px 20px;
            border-radius: 25px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(62, 177, 159, 0.3);
        }
        
        .team-linkedin:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 25px rgba(62, 177, 159, 0.5);
            background: linear-gradient(135deg, var(--secondary-green) 0%, var(--primary-teal) 100%);
        }
        
        .team-linkedin i {
            font-size: 1.2rem;
            font-style: normal;
        }
        
        /* Footer */
        .footer {
            text-align: center;
            padding: 25px 20px;
            color: var(--primary-blue);
            font-size: 0.9rem;
            margin-top: 25px;
            border-top: 3px solid rgba(62, 177, 159, 0.3);
        }
        
        .footer-icon {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: var(--primary-teal);
        }
        
        .footer-badge {
            display: inline-block;
            background: linear-gradient(135deg, rgba(62, 177, 159, 0.15) 0%, rgba(125, 200, 143, 0.15) 100%);
            border: 3px solid var(--primary-teal);
            padding: 12px 25px;
            border-radius: 40px;
            margin-top: 12px;
            font-size: 0.9rem;
            color: var(--primary-blue);
            font-weight: 700;
        }
        
        .footer-badge strong {
            color: var(--primary-teal);
            font-weight: 900;
            font-size: 1rem;
        }
        
        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 30px 15px;
            }
            
            .logo-container {
                width: 150px;
                height: 150px;
            }
            
            .main-title {
                font-size: 2.5rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
            }
            
            .description {
                font-size: 1rem;
            }
            
            .team-section {
                padding: 35px 25px;
            }
            
            .section-title {
                font-size: 1.8rem;
            }
            
            .team-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo & Title Section -->
        <div class="logo-section">
            <div class="logo-container">
                <svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
                    <!-- Water Drop Shape -->
                    <path d="M250 80 C 250 80, 320 180, 320 250 C 320 305, 280 340, 250 340 C 220 340, 180 305, 180 250 C 180 180, 250 80, 250 80 Z" 
                          fill="url(#dropGradient)" 
                          stroke="#2d5f7a" 
                          stroke-width="8"/>
                    
                    <!-- Inner Circle with Circuit -->
                    <circle cx="250" cy="240" r="50" fill="white" stroke="#2d5f7a" stroke-width="4"/>
                    
                    <!-- AI Chip Icon -->
                    <rect x="235" y="225" width="30" height="30" rx="3" fill="#3eb19f" stroke="#2d5f7a" stroke-width="2"/>
                    <circle cx="242" cy="232" r="2" fill="white"/>
                    <circle cx="258" cy="232" r="2" fill="white"/>
                    <circle cx="242" cy="248" r="2" fill="white"/>
                    <circle cx="258" cy="248" r="2" fill="white"/>
                    
                    <!-- Circuit Lines Around -->
                    <g stroke="#3eb19f" stroke-width="2" fill="none">
                        <line x1="220" y1="240" x2="200" y2="240"/>
                        <line x1="280" y1="240" x2="300" y2="240"/>
                        <line x1="250" y1="210" x2="250" y2="190"/>
                        <line x1="250" y1="270" x2="250" y2="290"/>
                        <line x1="225" y1="215" x2="210" y2="200"/>
                        <line x1="275" y1="215" x2="290" y2="200"/>
                        <line x1="225" y1="265" x2="210" y2="280"/>
                        <line x1="275" y1="265" x2="290" y2="280"/>
                    </g>
                    
                    <!-- Small Circuit Dots -->
                    <circle cx="200" cy="240" r="3" fill="#7dc88f"/>
                    <circle cx="300" cy="240" r="3" fill="#7dc88f"/>
                    <circle cx="250" cy="190" r="3" fill="#7dc88f"/>
                    <circle cx="250" cy="290" r="3" fill="#7dc88f"/>
                    
                    <!-- Rounded Rectangle Base -->
                    <rect x="60" y="380" width="380" height="80" rx="40" 
                          fill="white" 
                          stroke="#2d5f7a" 
                          stroke-width="8"/>
                    
                    <!-- Progress Bar Inside -->
                    <rect x="110" y="435" width="280" height="15" rx="7.5" 
                          fill="#e8f5f2"/>
                    <rect x="110" y="435" width="200" height="15" rx="7.5" 
                          fill="url(#barGradient)"/>
                    
                    <!-- Text: إرواء -->
                    <text x="250" y="420" 
                          font-family="Tajawal, Arial" 
                          font-size="50" 
                          font-weight="bold" 
                          fill="#3eb19f" 
                          text-anchor="middle">إرواء</text>
                    
                    <!-- Gradients -->
                    <defs>
                        <linearGradient id="dropGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#a8d5cc;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#3eb19f;stop-opacity:1" />
                        </linearGradient>
                        <linearGradient id="barGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#3eb19f;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#7dc88f;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <h1 class="main-title">إرواء</h1>
            <p class="subtitle">نظام ري ذكي للحد من مرض التصمّغ وهدر المياه</p>
            <p class="description">
                الفريق: منال اليامي - رغد المنقور - نورة الهويدي
            </p>
        </div>
        
        <!-- Team Section -->
        <div class="team-section">
            <h2 class="section-title">
                <i>👥</i>
                <span>فريق العمل</span>
            </h2>
            
            <div class="team-grid">
                <div class="team-member">
                    <div class="team-avatar">👩‍💻</div>
                    <div class="team-name">منال اليامي</div>
                    <a href="https://linkedin.com/in/manal-alyami" class="team-linkedin" target="_blank" rel="noopener noreferrer">
                        <i>🔗</i>
                        <span>لينكد إن</span>
                    </a>
                </div>
                
                <div class="team-member">
                    <div class="team-avatar">👩‍💻</div>
                    <div class="team-name">رغد المنقور</div>
                    <a href="https://linkedin.com/in/raghad-almanqour" class="team-linkedin" target="_blank" rel="noopener noreferrer">
                        <i>🔗</i>
                        <span>لينكد إن</span>
                    </a>
                </div>
                
                <div class="team-member">
                    <div class="team-avatar">👩‍💻</div>
                    <div class="team-name">نورة الهويدي</div>
                    <a href="https://linkedin.com/in/nora-alhuwaidi-2a89841b3" class="team-linkedin" target="_blank" rel="noopener noreferrer">
                        <i>🔗</i>
                        <span>لينكد إن</span>
                    </a>
                </div>
            </div>
        </div>
        
        <!-- Footer -->
        <div class="footer">
            <div class="footer-icon">💧</div>
            <p style="font-size: 1rem; margin-bottom: 8px; font-weight: 700;">
                صُنع بحب وإتقان
            </p>
            <div class="footer-badge">
                <strong>إرواء</strong> © 2025
            </div>
        </div>
    </div>
</body>
</html>
