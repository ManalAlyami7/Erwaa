<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="إرواء - نظام ري ذكي للحد من مرض التصمّغ">
    <title>إرواء - نظام الري الذكي</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🍊</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2d5f7a;
            --secondary: #3eb19f;
            --accent: #7dc88f;
            --bg: #f8fafb;
            --white: #ffffff;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg);
            color: #1a3a4a;
            direction: rtl;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary), #234a5f);
            color: var(--white);
            padding: 40px 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(45, 95, 122, 0.15);
            text-align: center;
        }
        
        .logo {
            width: 90px;
            height: 90px;
            background: var(--white);
            border-radius: 15px;
            padding: 12px;
            margin: 0 auto 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .tagline {
            font-size: 1.1rem;
            font-weight: 500;
            opacity: 0.95;
        }
        
        /* Team Section */
        .team-section {
            background: var(--white);
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(45, 95, 122, 0.08);
            margin-bottom: 25px;
        }
        
        .section-title {
            color: var(--primary);
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 25px;
            text-align: center;
        }
        
        .team-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        
        .team-member {
            background: #f8fafb;
            padding: 25px 15px;
            border-radius: 10px;
            text-align: center;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        
        .team-member:hover {
            transform: translateY(-5px);
            border-color: var(--secondary);
            box-shadow: 0 6px 20px rgba(62, 177, 159, 0.15);
            background: var(--white);
        }
        
        .avatar {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--secondary), var(--accent));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            margin: 0 auto 12px;
        }
        
        .name {
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 12px;
            font-size: 1rem;
        }
        
        .link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--white);
            background: var(--primary);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 20px;
            transition: all 0.3s;
        }
        
        .link:hover {
            transform: scale(1.05);
            background: var(--secondary);
        }
        
        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            color: var(--primary);
        }
        
        .footer-badge {
            display: inline-block;
            background: var(--white);
            padding: 15px 30px;
            border-radius: 40px;
            box-shadow: 0 2px 10px rgba(45, 95, 122, 0.08);
            font-weight: 600;
        }
        
        .footer-badge strong {
            color: var(--secondary);
            font-weight: 800;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .team-grid {
                grid-template-columns: 1fr;
            }
            
            .header {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <img src="erwaa_logo.png" alt="إرواء">
            </div>
            <h1>إرواء</h1>
            <div class="tagline">نظام ري ذكي للحد من مرض التصمّغ وهدر المياه</div>
        </header>
        
        <!-- Team -->
        <section class="team-section">
            <h2 class="section-title">👥 فريق العمل</h2>
            
            <div class="team-grid">
                <div class="team-member">
                    <div class="avatar">👩‍💻</div>
                    <div class="name">منال اليامي</div>
                    <a href="https://linkedin.com/in/manal-alyami" class="link" target="_blank" rel="noopener">
                        <span>🔗</span>
                        <span>LinkedIn</span>
                    </a>
                </div>
                
                <div class="team-member">
                    <div class="avatar">👩‍💻</div>
                    <div class="name">رغد المنقور</div>
                    <a href="https://linkedin.com/in/raghad-almanqour" class="link" target="_blank" rel="noopener">
                        <span>🔗</span>
                        <span>LinkedIn</span>
                    </a>
                </div>
                
                <div class="team-member">
                    <div class="avatar">👩‍💻</div>
                    <div class="name">نورة الهويدي</div>
                    <a href="https://linkedin.com/in/nora-alhuwaidi-2a89841b3" class="link" target="_blank" rel="noopener">
                        <span>🔗</span>
                        <span>LinkedIn</span>
                    </a>
                </div>
            </div>
        </section>
        
        <!-- Footer -->
        <footer class="footer">
            <div class="footer-badge">
                <strong>إرواء</strong> © 2025
            </div>
        </footer>
    </div>
</body>
</html>
